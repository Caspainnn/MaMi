<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交记录（收起）- 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 375px;
            min-height: 812px;
            background: #ffffff;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 顶部导航 */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 50px 16px 16px;
            gap: 12px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #5B5BFF;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .title-bar {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }
        
        .title-bar .arrow {
            margin: 0 8px;
            color: #999;
        }
        
        .new-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid #5B5BFF;
            color: #5B5BFF;
            font-size: 14px;
            font-weight: 500;
            background: #fff;
        }
        
        /* 题目标题区 */
        .problem-header {
            padding: 20px 24px;
        }
        
        .problem-title {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        
        .tags-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tag {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .tag-streak {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .tag-easy {
            background: #dcfce7;
            color: #16a34a;
        }
        
        /* Tab切换 */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .tab {
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            border: 1.5px solid #5B5BFF;
            color: #5B5BFF;
            background: #fff;
        }
        
        .tab.active {
            background: #5B5BFF;
            color: #fff;
        }
        
        /* 提交记录列表 - 收起状态 */
        .record-list {
            padding: 0 16px;
        }
        
        .record-item {
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            color: white;
        }
        
        .record-error {
            background: linear-gradient(135deg, #5B5BFF, #7C7CFF);
        }
        
        .record-timeout {
            background: linear-gradient(135deg, #5B5BFF, #7C7CFF);
        }
        
        .record-pass {
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
        }
        
        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .record-status {
            font-size: 20px;
            font-weight: 600;
        }
        
        .record-date {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .record-desc {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #5B5BFF;
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="back-btn">←</div>
            <div class="title-bar">
                LeetCode Hot 100
                <span class="arrow">〈 〉</span>
            </div>
            <button class="new-btn">斩</button>
        </div>
        
        <!-- 题目标题 -->
        <div class="problem-header">
            <div class="problem-title">两数之和</div>
            <div class="tags-row">
                <span class="tag tag-streak">一连</span>
                <span class="tag tag-easy">简单</span>
            </div>
            
            <div class="tabs">
                <div class="tab">题目详情</div>
                <div class="tab active">提交记录</div>
            </div>
        </div>
        
        <!-- 提交记录列表 - 收起状态 -->
        <div class="record-list">
            <div class="record-item record-error">
                <div class="record-header">
                    <span class="record-status">执行出错</span>
                    <span class="record-date">2026.06.18</span>
                </div>
                <div class="record-desc">
                    提交触发语法报错，因括号、标点、格式等基础书写失误，代码无法编译运行。逻辑无问题，后续需优先自查语法格式，杜绝低级错误。
                </div>
            </div>
            
            <div class="record-item record-timeout">
                <div class="record-header">
                    <span class="record-status">运行超时</span>
                    <span class="record-date">2026.07.08</span>
                </div>
                <div class="record-desc">
                    代码可正常运算结果，但使用O(n²)双层暴力循环，大数据用例下迭代耗时超标、触发超时。需改用哈希表优化时间复杂度。
                </div>
            </div>
            
            <div class="record-item record-pass">
                <div class="record-header">
                    <span class="record-status">通过</span>
                    <span class="record-date">2026.07.18</span>
                </div>
                <div class="record-desc">
                    哈希表一次遍历解题，遍历数组时存储元素值与下标，计算target差值，匹配到差值即返回对应双下标。时间复杂度O(n)，高效通过全部测试...
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>首页</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">📖</div>
                <span>题库</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📊</div>
                <span>统计</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
