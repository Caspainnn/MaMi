<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 375px;
            min-height: 812px;
            background: #ffffff;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            padding: 50px 24px 24px;
        }
        
        /* 用户信息区 */
        .user-section {
            display: flex;
            align-items: center;
            padding: 0 24px 32px;
        }
        
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
        }
        
        .user-name {
            flex: 1;
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .edit-btn {
            font-size: 20px;
            color: #333;
        }
        
        /* 斩杀计划卡片 */
        .plan-card {
            margin: 0 16px 24px;
            background: linear-gradient(135deg, #5B5BFF, #7C7CFF);
            border-radius: 20px;
            padding: 24px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .plan-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
            backdrop-filter: blur(10px);
        }
        
        .plan-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .plan-desc {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .plan-decoration {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 120px;
            opacity: 0.15;
        }
        
        /* 功能列表 */
        .menu-list {
            padding: 0 16px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: #ffffff;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1px solid #f0f0f0;
        }
        
        .menu-icon {
            width: 28px;
            height: 28px;
            margin-right: 16px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #5B5BFF;
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 页面标题 -->
        <div class="page-title">我的</div>
        
        <!-- 用户信息 -->
        <div class="user-section">
            <div class="avatar">👦</div>
            <div class="user-name">石耶</div>
            <div class="edit-btn">✏️</div>
        </div>
        
        <!-- 斩杀计划卡片 -->
        <div class="plan-card">
            <div class="plan-icon">✅</div>
            <div class="plan-title">斩杀计划</div>
            <div class="plan-desc">自定义自己的斩杀计划!不止LeetCode Hot 100!</div>
            <div class="plan-decoration">➕🔪</div>
        </div>
        
        <!-- 功能菜单 -->
        <div class="menu-list">
            <div class="menu-item">
                <div class="menu-icon">🔖</div>
                <span class="menu-text">收藏</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon">⚙️</div>
                <span class="menu-text">敬请期待</span>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>首页</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📖</div>
                <span>题库</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📊</div>
                <span>统计</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
