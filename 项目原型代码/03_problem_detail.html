<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情 - 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 375px;
            min-height: 812px;
            background: #ffffff;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 顶部导航 */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 50px 16px 16px;
            gap: 12px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #5B5BFF;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .title-bar {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }
        
        .title-bar .arrow {
            margin: 0 8px;
            color: #999;
        }
        
        .new-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid #5B5BFF;
            color: #5B5BFF;
            font-size: 14px;
            font-weight: 500;
            background: #fff;
        }
        
        /* 题目标题区 */
        .problem-header {
            padding: 20px 24px;
        }
        
        .problem-title {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        
        .tags-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tag {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .tag-streak {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .tag-easy {
            background: #dcfce7;
            color: #16a34a;
        }
        
        /* Tab切换 */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .tab {
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            border: 1.5px solid #5B5BFF;
            color: #5B5BFF;
            background: #fff;
        }
        
        .tab.active {
            background: #5B5BFF;
            color: #fff;
        }
        
        /* 题目描述 */
        .problem-description {
            padding: 0 24px;
            font-size: 15px;
            line-height: 1.7;
            color: #333;
        }
        
        /* 底部按钮 */
        .bottom-actions {
            position: absolute;
            bottom: 90px;
            left: 0;
            right: 0;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 28px;
            background: #5B5BFF;
            color: white;
            border: none;
            font-size: 17px;
            font-weight: 600;
        }
        
        .btn-secondary {
            width: 100%;
            padding: 16px;
            border-radius: 28px;
            background: #fff;
            color: #5B5BFF;
            border: 1.5px solid #5B5BFF;
            font-size: 17px;
            font-weight: 600;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #5B5BFF;
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="back-btn">←</div>
            <div class="title-bar">
                LeetCode Hot 100
                <span class="arrow">〈 〉</span>
            </div>
            <button class="new-btn">斩</button>
        </div>
        
        <!-- 题目标题 -->
        <div class="problem-header">
            <div class="problem-title">两数之和</div>
            <div class="tags-row">
                <span class="tag tag-streak">一连</span>
                <span class="tag tag-easy">简单</span>
            </div>
            
            <div class="tabs">
                <div class="tab active">题目描述</div>
                <div class="tab">提交记录</div>
            </div>
        </div>
        
        <!-- 题目描述 -->
        <div class="problem-description">
            <p>给定一个整数数组 nums 和一个整数目标值 target，请你在该数组中找出 和为目标值 target 的那 两个 整数，并返回它们的数组下标。</p>
            <br>
            <p>你可以假设每种输入只会对应一个答案，并且你不能使用两次相同的元素。</p>
            <br>
            <p>你可以按任意顺序返回答案。</p>
        </div>
        
        <!-- 底部按钮 -->
        <div class="bottom-actions">
            <button class="btn-primary">跳转刷题页面</button>
            <button class="btn-secondary">提交刷题记录</button>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>首页</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">📖</div>
                <span>题库</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📊</div>
                <span>统计</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
