<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计面板 - 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 375px;
            min-height: 812px;
            background: #ffffff;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 统计卡片通用样式 */
        .stats-card {
            margin: 16px;
            background: linear-gradient(135deg, #5B5BFF, #7C7CFF);
            border-radius: 20px;
            padding: 24px;
            color: white;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        /* 环形进度图 */
        .progress-ring-container {
            position: relative;
            width: 200px;
            height: 120px;
            margin: 0 auto 24px;
            overflow: hidden;
        }
        
        .progress-ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #7C3AED 0% 33%,
                #22C55E 33% 50%,
                #EF4444 50% 67%,
                #FBBF24 67% 83%,
                #60A5FA 83% 100%
            );
            -webkit-mask: radial-gradient(circle at center, transparent 55%, black 55%);
            mask: radial-gradient(circle at center, transparent 55%, black 55%);
            position: relative;
            top: 0;
        }
        
        .progress-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -30%);
            text-align: center;
        }
        
        .progress-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        
        .progress-value {
            font-size: 28px;
            font-weight: 700;
        }
        
        /* 图例 */
        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .legend-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .dot-1 { background: #7C3AED; }
        .dot-2 { background: #22C55E; }
        .dot-3 { background: #EF4444; }
        .dot-4 { background: #FBBF24; }
        .dot-5 { background: #60A5FA; }
        
        .legend-count {
            font-weight: 600;
            font-size: 16px;
        }
        
        /* 打卡卡片 */
        .checkin-card {
            margin: 16px;
            background: #ffffff;
            border: 2px solid #5B5BFF;
            border-radius: 20px;
            padding: 24px;
        }
        
        .checkin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .checkin-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .week-selector {
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* 柱状图 */
        .bar-chart {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 160px;
            padding: 0 8px;
            position: relative;
        }
        
        .bar-chart::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 24px;
            height: 1px;
            background: #e8e8ed;
        }
        
        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .bar-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 130px;
            gap: 4px;
        }
        
        .bar {
            width: 12px;
            border-radius: 6px 6px 0 0;
        }
        
        .bar-new {
            background: #5B5BFF;
        }
        
        .bar-review {
            background: #A78BFA;
        }
        
        .bar-label {
            font-size: 12px;
            color: #666;
        }
        
        /* Y轴刻度 */
        .y-axis {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
            padding-right: 8px;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #5B5BFF;
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 斩杀进度卡片 -->
        <div class="stats-card">
            <div class="card-title">斩杀进度</div>
            
            <div class="progress-ring-container">
                <div class="progress-ring"></div>
                <div class="progress-center">
                    <div class="progress-label">已刷题目</div>
                    <div class="progress-value">30/100</div>
                </div>
            </div>
            
            <div class="legend-list">
                <div class="legend-item">
                    <div class="legend-left">
                        <div class="legend-dot dot-1"></div>
                        <span>一破·卧龙出山</span>
                    </div>
                    <span class="legend-count">10</span>
                </div>
                <div class="legend-item">
                    <div class="legend-left">
                        <div class="legend-dot dot-2"></div>
                        <span>双连·一战成名</span>
                    </div>
                    <span class="legend-count">5</span>
                </div>
                <div class="legend-item">
                    <div class="legend-left">
                        <div class="legend-dot dot-3"></div>
                        <span>三连·举世皆惊</span>
                    </div>
                    <span class="legend-count">6</span>
                </div>
                <div class="legend-item">
                    <div class="legend-left">
                        <div class="legend-dot dot-4"></div>
                        <span>四连·天下无敌</span>
                    </div>
                    <span class="legend-count">4</span>
                </div>
                <div class="legend-item">
                    <div class="legend-left">
                        <div class="legend-dot dot-5"></div>
                        <span>五连·诛天灭地</span>
                    </div>
                    <span class="legend-count">5</span>
                </div>
            </div>
        </div>
        
        <!-- 每日打卡卡片 -->
        <div class="checkin-card">
            <div class="checkin-header">
                <div class="checkin-title">每日打卡情况</div>
                <div class="week-selector">This Week ▾</div>
            </div>
            
            <div class="bar-chart">
                <div class="y-axis">
                    <span>300</span>
                    <span>200</span>
                    <span>100</span>
                    <span>0</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 90%"></div>
                        <div class="bar bar-review" style="height: 100%"></div>
                    </div>
                    <span class="bar-label">M</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 30%"></div>
                        <div class="bar bar-review" style="height: 25%"></div>
                    </div>
                    <span class="bar-label">T</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 70%"></div>
                        <div class="bar bar-review" style="height: 80%"></div>
                    </div>
                    <span class="bar-label">W</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 65%"></div>
                        <div class="bar bar-review" style="height: 75%"></div>
                    </div>
                    <span class="bar-label">T</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 45%"></div>
                        <div class="bar bar-review" style="height: 50%"></div>
                    </div>
                    <span class="bar-label">F</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 20%"></div>
                        <div class="bar bar-review" style="height: 35%"></div>
                    </div>
                    <span class="bar-label">S</span>
                </div>
                
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-new" style="height: 75%"></div>
                        <div class="bar bar-review" style="height: 65%"></div>
                    </div>
                    <span class="bar-label">S</span>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>首页</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📖</div>
                <span>题库</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">📊</div>
                <span>统计</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
