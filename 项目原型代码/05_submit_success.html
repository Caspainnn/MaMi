<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功 - 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .modal-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }
        
        .success-title {
            font-size: 42px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 50px;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .btn-outline {
            width: 100%;
            padding: 18px;
            border-radius: 32px;
            background: #fff;
            color: #5B5BFF;
            border: 2px solid #5B5BFF;
            font-size: 22px;
            font-weight: 500;
        }
        
        .btn-primary {
            width: 100%;
            padding: 18px;
            border-radius: 32px;
            background: #5B5BFF;
            color: white;
            border: none;
            font-size: 22px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="success-title">提交成功！</div>
        <div class="btn-group">
            <button class="btn-outline">查看提交记录</button>
            <button class="btn-primary">返回首页</button>
        </div>
    </div>
</body>
</html>
