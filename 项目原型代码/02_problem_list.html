<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库 - 斩杀计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 375px;
            min-height: 812px;
            background: #ffffff;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 头部 */
        .header {
            padding: 50px 24px 16px;
        }
        
        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        
        .search-bar {
            display: flex;
            align-items: center;
            background: #f5f5f7;
            border-radius: 24px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #333;
        }
        
        .search-bar input::placeholder {
            color: #999;
        }
        
        .search-icon {
            font-size: 18px;
            margin-left: 8px;
        }
        
        /* 分类标签 */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .tab-item {
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            border: 1.5px solid #5B5BFF;
            color: #5B5BFF;
            background: #fff;
        }
        
        .tab-item.active {
            background: #5B5BFF;
            color: #fff;
        }
        
        /* 题目分类区域 */
        .section {
            margin-bottom: 24px;
        }
        
        .section-label {
            font-size: 14px;
            color: #666;
            padding: 0 24px;
            margin-bottom: 12px;
        }
        
        .problem-list {
            padding: 0 16px;
        }
        
        .problem-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: #fafafa;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #f0f0f0;
        }
        
        .problem-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #e8e8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 22px;
        }
        
        .problem-info {
            flex: 1;
        }
        
        .problem-name {
            font-size: 18px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        
        .problem-difficulty {
            font-size: 13px;
            font-weight: 500;
        }
        
        .difficulty-easy {
            color: #22c55e;
        }
        
        .difficulty-medium {
            color: #f59e0b;
        }
        
        .difficulty-hard {
            color: #ef4444;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #5B5BFF;
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 头部 -->
        <div class="header">
            <div class="page-title">LeetCode Hot 100</div>
            <div class="search-bar">
                <input type="text" placeholder="搜索题目">
                <span class="search-icon">🔍</span>
            </div>
            <div class="category-tabs">
                <div class="tab-item active">全部</div>
                <div class="tab-item">哈希</div>
                <div class="tab-item">二分</div>
                <div class="tab-item">链表</div>
            </div>
        </div>
        
        <!-- 哈希分类 -->
        <div class="section">
            <div class="section-label">哈希</div>
            <div class="problem-list">
                <div class="problem-item">
                    <div class="problem-icon">🌷</div>
                    <div class="problem-info">
                        <div class="problem-name">两数之和</div>
                    </div>
                    <span class="problem-difficulty difficulty-easy">简单</span>
                </div>
                <div class="problem-item">
                    <div class="problem-icon">⛰️</div>
                    <div class="problem-info">
                        <div class="problem-name">两数之和</div>
                    </div>
                    <span class="problem-difficulty difficulty-medium">中等</span>
                </div>
            </div>
        </div>
        
        <!-- 二分类 -->
        <div class="section">
            <div class="section-label">二分</div>
            <div class="problem-list">
                <div class="problem-item">
                    <div class="problem-icon">☯️</div>
                    <div class="problem-info">
                        <div class="problem-name">两数之和</div>
                    </div>
                    <span class="problem-difficulty difficulty-easy">简单</span>
                </div>
                <div class="problem-item">
                    <div class="problem-icon">🔗</div>
                    <div class="problem-info">
                        <div class="problem-name">两数之和</div>
                    </div>
                    <span class="problem-difficulty difficulty-hard">困难</span>
                </div>
            </div>
        </div>
        
        <!-- 链表分类 -->
        <div class="section">
            <div class="section-label">链表</div>
            <div class="problem-list">
                <div class="problem-item">
                    <div class="problem-icon">🔗</div>
                    <div class="problem-info">
                        <div class="problem-name">反转链表</div>
                    </div>
                    <span class="problem-difficulty difficulty-easy">简单</span>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>首页</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">📖</div>
                <span>题库</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📊</div>
                <span>统计</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
